# Demosaicing-only ablation: replaces the U-Net D_demosaicing block with a
# local Fourier/SIREN residual field. All other cortex and retina components,
# losses, resolutions, and update rates match the fidelity bfloat16 run.
Experiment:
  name: 'LMS_L1_Implicit'
  simulation_size: 256
  timesteps_per_image: 2
  simulating_tetra: false

RetinaModel:
  retina_spatial_sampling:
    type: 'Default'
  retina_spectral_sampling:
    type: 'Default'
    cone_types: 'LMS'
  retina_lateral_inhibition:
    type: 'Default'
  retina_eye_motion:
    type: 'Default'
  retina_spike_conversion:
    type: 'Default'
  max_shift_size: 15

Dataset:
  dataset_name: 'NTIRE'
  batch_size: 8
  # Avoid pinning the entire 4.2 GiB LMS corpus in unified Metal memory.
  device_resident: false

DimensionalityBoosting:
  is_dimensionality_boosting: false
  previous_cone_mosaic: null
  load_pretrain_timestep: null

Training:
  learning_rate: 0.001
  learning_progress_logging: true
  logging_mode: 'Local'
  logging_cycle: 1000
  max_gradient_updates: 100000
  checkpoint_cycle: 1000
  lr_schedule: 'warmup_cosine'
  warmup_steps: 1000
  end_learning_rate: 0.00001
  ns_ip_loss: 'l1'
  cell_position_update_cycle: 4

CorticalModel:
  cortex_learn_eye_motion:
    type: 'Default'
  cortex_learn_spatial_sampling:
    type: 'Default'
  cortex_learn_cone_spectral_type:
    type: 'Default'
  cortex_learn_demosaicing:
    type: 'Implicit'
    context_channels: 16
    hidden_channels: 32
    num_frequencies: 6
    omega0: 10.0
    activation: 'relu'
    compute_dtype: 'bfloat16'
  cortex_learn_lateral_inhibition:
    type: 'Default'
  latent_dim: 8
