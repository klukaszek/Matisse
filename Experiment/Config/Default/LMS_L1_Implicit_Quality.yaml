# Quality-focused implicit demosaicing ablation. It retains the lightweight
# Fourier field while adding local hidden mixing and observer-neutral temporal
# consistency to suppress latent chromatic noise that ONS re-encoding cannot see.
Experiment:
  name: 'LMS_L1_Implicit_Quality'
  simulation_size: 256
  timesteps_per_image: 2
  simulating_tetra: false

RetinaModel:
  retina_spatial_sampling:
    type: 'Default'
  retina_spectral_sampling:
    type: 'Default'
    cone_types: 'LMS'
  retina_lateral_inhibition:
    type: 'Default'
  retina_eye_motion:
    type: 'Default'
  retina_spike_conversion:
    type: 'Default'
  max_shift_size: 15

Dataset:
  dataset_name: 'NTIRE'
  batch_size: 8
  device_resident: false

DimensionalityBoosting:
  is_dimensionality_boosting: false
  previous_cone_mosaic: null
  load_pretrain_timestep: null

Training:
  learning_rate: 0.001
  learning_progress_logging: true
  logging_mode: 'Local'
  logging_cycle: 1000
  max_gradient_updates: 100000
  checkpoint_cycle: 1000
  lr_schedule: 'warmup_cosine'
  warmup_steps: 1000
  end_learning_rate: 0.00001
  ns_ip_loss: 'l1'
  cell_position_update_cycle: 4
  ons_loss: 'huber'
  ons_huber_delta: 0.01

  # Align every latent channel across natural eye motion. This constrains the
  # perceptual null space without assuming RGB or a particular cone count.
  latent_consistency_weight: 0.1
  # A representative subset keeps the second decode inexpensive while
  # providing the consistency signal on every optimizer step.
  latent_consistency_batch_size: 2

CorticalModel:
  cortex_learn_eye_motion:
    type: 'Default'
  cortex_learn_spatial_sampling:
    type: 'Default'
  cortex_learn_cone_spectral_type:
    type: 'Default'
  cortex_learn_demosaicing:
    type: 'Implicit'
    context_channels: 24
    context_kernel_size: 7
    hidden_channels: 48
    hidden_kernel_size: 1
    num_frequencies: 6
    omega0: 10.0
    activation: 'relu'
    compute_dtype: 'bfloat16'
  cortex_learn_lateral_inhibition:
    type: 'Default'
  latent_dim: 8
