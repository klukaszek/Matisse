[project]
name = "matisse-torch"
version = "0.1.0"
description = "PyTorch implementation of Project Matisse (color vision modeling)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "comet-ml>=3.48.1",
    "h5py>=3.15.1",
    "imageio>=2.37.2",
    "ipython>=8.31.0",
    "matplotlib>=3.10.8",
    "normflows>=1.7.3",
    "numpy>=2.4.1",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scipy>=1.15.1",
    "torch>=2.12.0",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
]
